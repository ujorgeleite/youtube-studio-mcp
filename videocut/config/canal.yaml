# Regras editoriais do canal. O planejador as recebe antes do inventário.
# Edite à vontade: elas pesam mais que as preferências genéricas do modelo.
canal: Do Sul pra Fora
publico: >-
  Família gaúcha vivendo na Holanda. Vídeos sobre rotina, adaptação, passeios
  e reflexões da família.
regras:
  - Nos primeiros 15 segundos, mostrar a ideia central ou um momento que desperte curiosidade.
  - Toda proposta precisa de mensagem sustentada por fala real; imagens sozinhas não bastam.
  - Preferir falas espontâneas a explicações longas; evitar repetir a mesma ideia.
  - Deixar ações e momentos de ambiente respirarem entre falas.
  - Usar imagens de apoio sobre falas longas para variar os planos.
  - Encerrar com conclusão, resultado ou reflexão que já exista no material.
  - Nunca inventar contexto familiar, sentimentos ou motivos que não estejam nas falas.
formatos:
  auto: Deixar o sistema sugerir o formato a partir do material.
  vlog-reflexao: Vlog com reflexão — experiência vivida seguida do que ela significou.
  relato: Relato / experiência — narrativa em primeira pessoa com imagens de apoio.
  passeio: Passeio — ritmo visual, falas curtas, som ambiente em destaque.
